name: Resize game-servers node

# Resizes the control-plane node to whatever server_type variables.tf requests, and
# nothing else. The capacity watch dispatches this when Hetzner has cx53 stock.
#
# Deliberately NOT deploy-infra: a full apply also reconciles flux_bootstrap, whose
# post-upgrade hook fails independently of the node type (it needs a bootstrap_revision
# bump to re-run), so a resize routed through it fails for unrelated reasons. Targeting
# the server resource keeps the claim narrow and reliable.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resize:
    runs-on: ubuntu-latest
    env:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      TF_VAR_sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

    steps:
      - uses: actions/checkout@v6

      - uses: opentofu/setup-opentofu@v2

      - name: Install talosctl, kubectl and sops
        run: |
          curl -fsSL https://github.com/siderolabs/talos/releases/download/v1.12.7/talosctl-linux-amd64 -o /tmp/talosctl
          curl -fsSL https://dl.k8s.io/release/v1.33.4/bin/linux/amd64/kubectl -o /tmp/kubectl
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.12.2/sops-v3.12.2.linux.amd64 -o /tmp/sops
          chmod +x /tmp/talosctl /tmp/kubectl /tmp/sops
          sudo mv /tmp/talosctl /tmp/kubectl /tmp/sops /usr/local/bin/

      - name: Resize the node and readvertise its capacity
        working-directory: infra/game-servers
        run: |
          set -e
          # One step on purpose: the R2 backend credentials below do not survive into a
          # later step, and `tofu output` needs them to read state.
          AWS_ACCESS_KEY_ID=$(sops decrypt --extract '["s3_access_key"]' ../secrets.sops.yaml)
          AWS_SECRET_ACCESS_KEY=$(sops decrypt --extract '["s3_secret_key"]' ../secrets.sops.yaml)
          CF_ACCOUNT_ID=$(sops decrypt --extract '["cloudflare_account_id"]' ../secrets.sops.yaml)
          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
          export AWS_ENDPOINT_URL_S3="https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"

          tofu init -input=false \
            -backend-config="access_key=$AWS_ACCESS_KEY_ID" \
            -backend-config="secret_key=$AWS_SECRET_ACCESS_KEY"

          # The talosconfig/kubeconfig writers must be targeted too, or a fresh checkout
          # has no credentials to talk to the node afterwards.
          tofu apply -input=false -auto-approve \
            -target=module.talos.hcloud_server.control_plane \
            -target=module.talos.terraform_data.create_talosconfig \
            -target=module.talos.terraform_data.create_kubeconfig

          # kubelet caches CPU/RAM at startup, so without this the node keeps advertising
          # the old numbers and the larger Dune maps stay Pending.
          IP=$(tofu output -raw server_ip)
          talosctl --talosconfig talosconfig -n "$IP" service kubelet restart
          for i in $(seq 1 30); do
            kubectl --kubeconfig kubeconfig get nodes >/dev/null 2>&1 && break
            sleep 10
          done
          kubectl --kubeconfig kubeconfig wait --for=condition=Ready node --all --timeout=5m
          kubectl --kubeconfig kubeconfig get nodes \
            -o custom-columns=NAME:.metadata.name,CPU:.status.capacity.cpu,MEM:.status.capacity.memory
