name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    name: Manifests + policies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: int128/kustomize-action@v1
        id: kustomize
        with:
          kustomization: "k8s/**/kustomization.yaml"

      - name: Stage rendered manifests
        run: cp -r "${{ steps.kustomize.outputs.directory }}/." ./_rendered

      - name: Validate manifests against K8s schemas
        uses: docker://ghcr.io/yannh/kubeconform:v0.7.0
        with:
          args: >-
            -strict -ignore-missing-schemas -skip Secret
            -schema-location default
            -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
            -summary _rendered/

      - name: Conftest policies
        uses: docker://openpolicyagent/conftest:latest
        with:
          args: >-
            test --policy policy/ --combine
            k8s/clusters/tools/resource-set.yaml
            k8s/clusters/tools-staging/resource-set.yaml
            k8s/apps/

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  renovate:
    name: Renovate config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Validate renovate.json5
        # Without --strict: warnings (like manager-scope managerFilePatterns deprecation
        # in Renovate 43.x) don't fail the build. Real errors still do.
        run: npx --yes --package renovate -- renovate-config-validator

  tofu:
    name: OpenTofu (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - infra/tools
          - infra/tools-staging
          - infra/game-servers
          - infra/r2
    steps:
      - uses: actions/checkout@v6
      - uses: opentofu/setup-opentofu@v2
      - name: tofu fmt -check
        run: tofu fmt -check -recursive ${{ matrix.dir }}
      - name: tofu init (no backend)
        run: tofu -chdir=${{ matrix.dir }} init -backend=false -input=false
      - name: tofu validate
        run: tofu -chdir=${{ matrix.dir }} validate -no-color
