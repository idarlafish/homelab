name: Validate

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  k8s:
    name: K8s manifests + secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: int128/kustomize-action@v1
        id: kustomize
        with:
          kustomization: "k8s/**/kustomization.yaml"

      - name: Stage rendered manifests
        run: cp -r "${{ steps.kustomize.outputs.directory }}/." ./_rendered

      - name: Validate manifests against K8s schemas
        uses: docker://ghcr.io/yannh/kubeconform:v0.7.0
        with:
          args: >-
            -strict -ignore-missing-schemas -skip Secret
            -schema-location default
            -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
            -summary _rendered/

      - name: Verify Secrets are SOPS-encrypted
        run: |
          bad=$(grep -lrE '^kind: Secret$' k8s --include='*.yaml' | xargs grep -L 'ENC\[AES256_GCM' || true)
          [ -z "$bad" ] || { echo "::error::Unencrypted Secret manifests:"; echo "$bad"; exit 1; }

  renovate:
    name: Renovate config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Validate renovate.json5
        # Without --strict: warnings (like manager-scope managerFilePatterns deprecation
        # in Renovate 43.x) don't fail the build. Real errors still do.
        run: npx --yes --package renovate -- renovate-config-validator

  tofu:
    name: OpenTofu (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - infra/tools
          - infra/game-servers
          - infra/tools-staging
          - infra/r2
    steps:
      - uses: actions/checkout@v6
      - uses: opentofu/setup-opentofu@v2
      - name: tofu fmt -check
        run: tofu fmt -check -recursive ${{ matrix.dir }}
      - name: tofu init (no backend)
        run: tofu -chdir=${{ matrix.dir }} init -backend=false -input=false
      - name: tofu validate
        run: tofu -chdir=${{ matrix.dir }} validate -no-color
