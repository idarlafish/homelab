name: Deploy Tools Infrastructure

on:
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest
    outputs:
      server_ip: ${{ steps.terraform_output.outputs.SERVER_IP }}
    env:
      TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
      TF_VAR_ssh_key_name: ${{ secrets.HCLOUD_SSH_KEY_NAME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: infra/tools
        run: |
          terraform init \
            -backend-config="access_key=${{ secrets.S3_ACCESS_KEY }}" \
            -backend-config="secret_key=${{ secrets.S3_SECRET_KEY }}"

      - name: Terraform Plan
        id: plan
        working-directory: infra/tools
        run: |
          set +e
          terraform plan -detailed-exitcode -input=false -out=tfplan
          exit_code=$?
          set -e
          if [ $exit_code -eq 2 ]; then
            echo "Pending changes detected."
            exit 0
          elif [ $exit_code -eq 0 ]; then
            echo "No changes."
            exit 0
          else
            echo "Terraform plan failed."
            exit 1
          fi

      - name: Terraform Apply
        working-directory: infra/tools
        if: steps.plan.outcome == 'success'
        run: terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        working-directory: infra/tools
        id: terraform_output
        run: |
          echo "SERVER_IP=$(terraform output -raw server_ip)" >> $GITHUB_OUTPUT

  bootstrap-flux:
    runs-on: ubuntu-latest
    needs: terraform
    env:
      KUBECONFIG: /tmp/kubeconfig

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HCLOUD_SSH_KEY }}

      - name: Fetch kubeconfig
        uses: nick-fields/retry@v3
        with:
          timeout_seconds: 30
          max_attempts: 6
          command: scp -o StrictHostKeyChecking=no root@${{ needs.terraform.outputs.server_ip }}:/root/.kube/config $KUBECONFIG

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Wait for cluster ready
        run: kubectl wait --for=condition=Ready nodes --all --timeout=90s

      - name: Install Flux CLI
        uses: fluxcd/flux2/action@main

      - name: Create SOPS age secret
        run: |
          kubectl create namespace flux-system --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic sops-age \
            --namespace=flux-system \
            --from-literal=age.agekey="${{ secrets.SOPS_AGE_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Bootstrap FluxCD
        run: |
          flux bootstrap github \
            --owner=idarlafish \
            --repository=tools \
            --branch=main \
            --path=k8s/clusters/tools \
            --personal \
            --token-auth
        env:
          GITHUB_TOKEN: ${{ secrets.FLUX_GITHUB_PAT }}

