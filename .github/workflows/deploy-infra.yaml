name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which cluster to provision (tools or game-servers)"
        required: true
        type: choice
        options:
          - tools
          - game-servers

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TF_VAR_hcloud_token:       ${{ secrets.HCLOUD_TOKEN }}
      TF_VAR_ssh_key_name:       ${{ inputs.target == 'tools' && secrets.HCLOUD_SSH_KEY_NAME || secrets.GAME_SERVERS_HCLOUD_SSH_KEY_NAME }}
      TF_VAR_github_token:       ${{ secrets.FLUX_GITHUB_PAT }}
      TF_VAR_sops_age_key:       ${{ secrets.SOPS_AGE_KEY }}
      AWS_ACCESS_KEY_ID:         ${{ secrets.S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY:     ${{ secrets.S3_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v6

      - uses: opentofu/setup-opentofu@v2

      - name: Load SSH key into agent
        env:
          SSH_KEY: ${{ inputs.target == 'tools' && secrets.HCLOUD_SSH_KEY || secrets.GAME_SERVERS_HCLOUD_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$SSH_KEY"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Tofu init / plan / apply
        working-directory: infra/${{ inputs.target }}
        run: |
          tofu init -backend-config="access_key=$AWS_ACCESS_KEY_ID" -backend-config="secret_key=$AWS_SECRET_ACCESS_KEY"
          tofu plan -input=false -out=tfplan
          tofu apply -input=false tfplan
