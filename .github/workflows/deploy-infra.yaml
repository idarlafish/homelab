name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which cluster to provision (tools or game-servers)"
        required: true
        type: choice
        options:
          - tools
          - game-servers

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      TF_VAR_sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

    steps:
      - uses: actions/checkout@v6

      - uses: opentofu/setup-opentofu@v2

      - name: Install sops (for backend creds only)
        run: |
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.12.2/sops-v3.12.2.linux.amd64 -o /tmp/sops
          chmod +x /tmp/sops && sudo mv /tmp/sops /usr/local/bin/sops

      - name: Tofu apply
        working-directory: infra/${{ inputs.target }}
        run: |
          set -e
          # The S3 backend initialises before any provider, so we must read R2 creds
          # outside Tofu. Everything else is decrypted in-graph by carlpett/sops.
          AWS_ACCESS_KEY_ID=$(sops decrypt --extract '["s3_access_key"]' ../secrets.sops.yaml)
          AWS_SECRET_ACCESS_KEY=$(sops decrypt --extract '["s3_secret_key"]' ../secrets.sops.yaml)
          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY

          tofu init -input=false \
            -backend-config="access_key=$AWS_ACCESS_KEY_ID" \
            -backend-config="secret_key=$AWS_SECRET_ACCESS_KEY"
          tofu plan -input=false -out=tfplan
          tofu apply -input=false tfplan
