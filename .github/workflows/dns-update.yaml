name: Update Cloudflare DNS

on:
    workflow_call:
        inputs:
            zone-id:
                required: true
                type: string
            domain:
                required: true
                type: string
            ip-address:
                required: true
                type: string
        secrets:
            CLOUDFLARE_API_TOKEN:
                required: true

jobs:
    dns-update:
        runs-on: ubuntu-latest
        steps:
            - name: Update DNS record
              env:
                  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CF_ZONE_ID: ${{ inputs.zone-id }}
                  SERVER_IP: ${{ inputs.ip-address }}
                  DOMAIN: ${{ inputs.domain }}
              run: |
                  RESPONSE=$(curl -s -X GET \
                    "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records?name=$DOMAIN&type=A" \
                    -H "Authorization: Bearer $CF_API_TOKEN" \
                    -H "Content-Type: application/json")

                  RECORD_ID=$(echo "$RESPONSE" | jq -r '.result[0].id // empty')

                  if [ "$RECORD_ID" = "null" ] || [ -z "$RECORD_ID" ]; then
                    echo "Creating new A record for $DOMAIN"
                    curl -s -X POST \
                      "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records" \
                      -H "Authorization: Bearer $CF_API_TOKEN" \
                      -H "Content-Type: application/json" \
                      --data "{\"type\":\"A\",\"name\":\"$DOMAIN\",\"content\":\"$SERVER_IP\",\"ttl\":60,\"proxied\":true}" | jq
                  else
                    echo "Updating existing record $RECORD_ID for $DOMAIN"
                    curl -s -X PUT \
                      "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records/$RECORD_ID" \
                      -H "Authorization: Bearer $CF_API_TOKEN" \
                      -H "Content-Type: application/json" \
                      --data "{\"type\":\"A\",\"name\":\"$DOMAIN\",\"content\":\"$SERVER_IP\",\"ttl\":60,\"proxied\":true}" | jq
                  fi
