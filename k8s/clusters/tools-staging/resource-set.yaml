---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: cluster-kustomizations
  namespace: flux-system
spec:
  inputs:
    - name: infrastructure
      path: ./k8s/infrastructure/tools-staging
      wait: true
      dependsOn: []
    - name: cloudflared
      path: ./k8s/apps/cloudflared-staging
      wait: true
      dependsOn:
        - name: infrastructure
    # content/booklore is omitted for now: it pins a static PV
    # (pv-booklore-books) that only exists on the tools cluster.
    # Follow-up: per-cluster Tofu-provisioned Hetzner Volume.
    - name: monitoring-stack
      path: ./k8s/apps/monitoring/stack
      wait: true
      dependsOn:
        - name: infrastructure
    - name: monitoring
      path: ./k8s/apps/monitoring/extras
      wait: true
      dependsOn:
        - name: monitoring-stack
    - name: identity
      path: ./k8s/apps/identity
      wait: true
      dependsOn:
        - name: monitoring-stack
    # vpn: wait:false because wg-easy is intentionally at replicas:0
    - name: vpn
      path: ./k8s/apps/vpn
      wait: false
      dependsOn:
        - name: infrastructure
  resources:
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: << inputs.name >>
        namespace: flux-system
      spec:
        interval: 10m
        sourceRef:
          kind: GitRepository
          name: flux-system
        path: << inputs.path >>
        prune: true
        wait: << inputs.wait >>
        timeout: 5m
        dependsOn: << inputs.dependsOn | toYaml | nindent 10 >>
        decryption:
          provider: sops
          secretRef:
            name: sops-age
        postBuild:
          substitute:
            CLUSTER_NAME: tools-staging
            HOSTNAME_AUTH: auth-staging.la.fish
            HOSTNAME_BOOKLORE: booklore-staging.la.fish
            HOSTNAME_GRAFANA: grafana-staging.la.fish
            HOSTNAME_PROMETHEUS: prometheus-staging.la.fish
            HOSTNAME_WG: wg-staging.la.fish
            HOSTNAME_WG_ADMIN: wg-admin-staging.la.fish
