---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: cluster-kustomizations
  namespace: flux-system
spec:
  inputs:
    - name: cloudflared
      path: ./k8s/apps/cloudflared
      wait: true
      dependsOn: []
    - name: content
      path: ./k8s/apps/content
      wait: true
      dependsOn: []
    - name: monitoring-stack
      path: ./k8s/apps/monitoring/stack
      wait: true
      dependsOn: []
    - name: alerts
      path: ./k8s/apps/monitoring/alerts
      wait: true
      dependsOn:
        - name: monitoring-stack
    - name: probes
      path: ./k8s/apps/monitoring/probes
      wait: true
      dependsOn:
        - name: monitoring-stack
    - name: prometheus-auth
      path: ./k8s/apps/monitoring/prometheus-auth
      wait: true
      dependsOn:
        - name: monitoring-stack
    - name: grafana-git-sync
      path: ./k8s/apps/monitoring/grafana-git-sync
      wait: true
      dependsOn:
        - name: monitoring-stack
    - name: uptime
      path: ./k8s/apps/monitoring/uptime
      wait: true
      dependsOn:
        - name: alerts
    - name: identity
      path: ./k8s/apps/identity
      wait: true
      dependsOn:
        - name: monitoring-stack
    # vpn: wait:false because wg-easy is intentionally at replicas:0
    - name: vpn
      path: ./k8s/apps/vpn
      wait: false
      dependsOn: []
    - name: csi-nfs
      path: ./k8s/apps/csi-nfs
      wait: true
      dependsOn: []
    - name: files
      path: ./k8s/apps/files
      wait: true
      dependsOn:
        - name: content
        - name: csi-nfs
    - name: velero
      path: ./k8s/apps/velero
      wait: true
      dependsOn:
        - name: monitoring-stack
    - name: velero-schedules
      path: ./k8s/apps/velero/schedules-tools
      wait: true
      dependsOn:
        - name: velero
  resources:
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: << inputs.name >>
        namespace: flux-system
      spec:
        interval: 10m
        sourceRef:
          kind: GitRepository
          name: flux-system
        path: << inputs.path >>
        prune: true
        wait: << inputs.wait >>
        timeout: 5m
        dependsOn: << inputs.dependsOn | toYaml | nindent 10 >>
        decryption:
          provider: sops
          secretRef:
            name: sops-age
        postBuild:
          substitute:
            CLUSTER_NAME: tools
            BUCKET_NAME: tools-backups
            HOSTNAME_AUTH: auth.la.fish
            HOSTNAME_BOOKLORE: booklore.la.fish
            HOSTNAME_GRAFANA: grafana.la.fish
            HOSTNAME_PROMETHEUS: prometheus.la.fish
            HOSTNAME_WG: wg.la.fish
            HOSTNAME_WG_ADMIN: wg-admin.la.fish
            HOSTNAME_PAPERLESS: paperless.la.fish
          substituteFrom:
            - kind: ConfigMap
              name: cluster-vars
              optional: false
