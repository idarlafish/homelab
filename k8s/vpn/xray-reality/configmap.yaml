apiVersion: v1
kind: ConfigMap
metadata:
  name: xray-reality-config
  namespace: vpn
data:
  config.json: |
    {
      "log": {
        "loglevel": "warning"
      },
      "inbounds": [
        {
          "listen": "0.0.0.0",
          "port": 443,
          "protocol": "vless",
          "settings": {
            "clients": [
              {
                "id": "XRAY_UUID_PLACEHOLDER",
                "flow": "xtls-rprx-vision"
              }
            ],
            "decryption": "none"
          },
          "streamSettings": {
            "network": "tcp",
            "security": "reality",
            "realitySettings": {
              "show": false,
              "dest": "www.samsung.com:443",
              "serverNames": [
                "www.samsung.com",
                "samsung.com"
              ],
              "privateKey": "XRAY_PRIVATE_KEY_PLACEHOLDER",
              "shortIds": [
                "XRAY_SHORT_ID_PLACEHOLDER"
              ],
              "maxTimeDiff": 0
            }
          },
          "sniffing": {
            "enabled": true,
            "destOverride": [
              "http",
              "tls",
              "quic"
            ]
          }
        }
      ],
      "outbounds": [
        {
          "protocol": "freedom",
          "tag": "direct"
        },
        {
          "protocol": "blackhole",
          "tag": "block"
        }
      ]
    }
