apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: booklore
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
      - name: mariadb
        image: mariadb:11
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: booklore-db
              key: mysql-root-password
        - name: MYSQL_DATABASE
          value: booklore
        - name: MYSQL_USER
          value: booklore
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: booklore-db
              key: mysql-password
        ports:
        - containerPort: 3306
          name: mysql
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 3Gi
      storageClassName: local-path
