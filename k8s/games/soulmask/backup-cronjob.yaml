---
# Scheduled off-node backup of the soulmask save data to Cloudflare R2.
#
# Runs every 6 hours. Flow:
#   1. Scale the soulmask statefulset to 0 (~30s)
#   2. Wait for the pod to terminate cleanly (so the PVC is unmounted and
#      saves are flushed to disk by Soulmask's SIGTERM handler).
#   3. Apply a backup Job that mounts the PVC read-only, tars WS/Saved/,
#      and uploads the archive to s3://fabler/backups/game-servers/soulmask/
#   4. Scale the statefulset back up, which triggers a fresh SteamCMD
#      auto-update via entrypoint.sh.
#
# Roughly 2 minutes of downtime every 6 hours. Requires:
#   - rbac.yaml (ServiceAccount soulmask-ops)
#   - r2-credentials Secret in the soulmask namespace (see README.md)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: soulmask-scheduled-backup
  namespace: soulmask
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: soulmask-ops
          restartPolicy: Never
          containers:
            - name: backup-orchestrator
              image: bitnami/kubectl:latest
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  JOB_NAME="soulmask-backup"

                  echo "[$(date -Iseconds)] scaling down soulmask..."
                  kubectl -n soulmask scale statefulset/soulmask --replicas=0
                  kubectl -n soulmask wait --for=delete pod/soulmask-0 --timeout=240s || true

                  echo "[$(date -Iseconds)] cleaning up any previous backup job..."
                  kubectl -n soulmask delete job "$JOB_NAME" --ignore-not-found

                  echo "[$(date -Iseconds)] launching backup job..."
                  cat <<'YAML' | kubectl -n soulmask apply -f -
                  apiVersion: batch/v1
                  kind: Job
                  metadata:
                    name: soulmask-backup
                  spec:
                    ttlSecondsAfterFinished: 300
                    template:
                      spec:
                        restartPolicy: Never
                        containers:
                          - name: backup
                            image: alpine:latest
                            command:
                              - /bin/sh
                              - -c
                              - |
                                set -eu
                                apk add --no-cache aws-cli tar
                                TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                                BACKUP_KEY="backups/game-servers/soulmask/soulmask-${TIMESTAMP}.tar.gz"
                                echo "Backing up soulmask saves to s3://fabler/${BACKUP_KEY}"
                                cd /data
                                if [ -d WS/Saved ]; then
                                  tar czf /tmp/backup.tar.gz WS/Saved
                                else
                                  echo "warning: WS/Saved does not exist yet, archiving entire PVC"
                                  tar czf /tmp/backup.tar.gz .
                                fi
                                FILESIZE=$(du -h /tmp/backup.tar.gz | cut -f1)
                                echo "Archive size: ${FILESIZE}"
                                aws s3 cp /tmp/backup.tar.gz "s3://fabler/${BACKUP_KEY}"
                                echo "Backup complete: ${BACKUP_KEY}"
                            env:
                              - name: AWS_ACCESS_KEY_ID
                                valueFrom:
                                  secretKeyRef:
                                    name: r2-credentials
                                    key: access-key-id
                              - name: AWS_SECRET_ACCESS_KEY
                                valueFrom:
                                  secretKeyRef:
                                    name: r2-credentials
                                    key: secret-access-key
                              - name: AWS_ENDPOINT_URL
                                value: "https://95c5c6e1c01ea2d0c9fab69ee9e28462.r2.cloudflarestorage.com"
                            volumeMounts:
                              - name: soulmask-data
                                mountPath: /data
                                readOnly: true
                        volumes:
                          - name: soulmask-data
                            persistentVolumeClaim:
                              claimName: soulmask-data-soulmask-0
                  YAML

                  echo "[$(date -Iseconds)] waiting for backup job to finish..."
                  kubectl -n soulmask wait --for=condition=complete job/"$JOB_NAME" --timeout=1800s
                  kubectl -n soulmask logs job/"$JOB_NAME"

                  echo "[$(date -Iseconds)] scaling soulmask back up..."
                  kubectl -n soulmask scale statefulset/soulmask --replicas=1
                  echo "[$(date -Iseconds)] backup cycle done"
