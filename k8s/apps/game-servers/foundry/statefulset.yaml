---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: foundry
  namespace: foundry
spec:
  selector:
    matchLabels:
      app: foundry
  serviceName: "foundry"
  replicas: 0
  template:
    metadata:
      labels:
        app: foundry
    spec:
      containers:
        - name: foundry
          image: luxusburg/docker-foundry:1.6
          imagePullPolicy: Always
          env:
            - name: SERVER_PWD
              valueFrom:
                secretKeyRef:
                  name: foundry-secrets
                  key: serverPassword
          envFrom:
            - configMapRef:
                name: foundry-cm
          resources:
            requests:
              cpu: "250m"
              memory: "4Gi"
            limits:
              memory: "4Gi"
          ports:
            - name: game
              containerPort: 3724
              protocol: UDP
          volumeMounts:
            - name: foundry-saves
              mountPath: /home/foundry/persistent_data
            - name: server-files
              mountPath: /home/foundry/server_files
      volumes:
        - name: server-files
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: foundry-saves
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi
        storageClassName: hcloud-volumes
