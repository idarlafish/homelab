---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: enshrouded
  namespace: enshrouded
spec:
  selector:
    matchLabels:
      app: enshrouded
  serviceName: "enshrouded"
  replicas: 1
  template:
    metadata:
      labels:
        app: enshrouded
    spec:
      containers:
        - name: enshrouded
          image: mornedhels/enshrouded-server:dev-proton@sha256:d122801bb54498f41a6c0d8b27f336ec4c9266ffd5e4660611cb7c20c162318f
          imagePullPolicy: Always
          env:
            - name: SERVER_ROLE_0_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: enshrouded-secrets
                  key: adminPassword
          envFrom:
            - configMapRef:
                name: enshrouded-cm
          resources:
            requests:
              cpu: "500m"
              memory: "20Gi"
            limits:
              memory: "20Gi"
          ports:
            - name: "game"
              containerPort: 15637
              protocol: UDP
          volumeMounts:
            - name: enshrouded-data
              mountPath: /opt/enshrouded/server/savegame
  volumeClaimTemplates:
    - metadata:
        name: enshrouded-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi
        storageClassName: hcloud-volumes