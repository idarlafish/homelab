---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-collector
  namespace: metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-collector
  template:
    metadata:
      labels:
        app: metrics-collector
    spec:
      serviceAccountName: metrics-collector
      containers:
        - name: alloy
          image: grafana/alloy:v1.16.0
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/tmp/alloy
            - --server.http.listen-addr=0.0.0.0:12345
          ports:
            - containerPort: 12345
              name: http
          startupProbe:
            httpGet:
              path: /-/healthy
              port: 12345
            periodSeconds: 5
            failureThreshold: 12  # 60s startup budget
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 12345
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 12345
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 384Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
      volumes:
        - name: config
          configMap:
            name: alloy-config
