---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# backup-job.yaml is intentionally NOT listed — it's applied on-demand by
# scripts/backup-game.sh, not managed by Flux. Excluding it here prevents
# Flux from re-creating the Job on every reconcile.
resources:
  - namespace.yaml
  - configmap.yaml
  - service.yaml
  - statefulset.yaml
