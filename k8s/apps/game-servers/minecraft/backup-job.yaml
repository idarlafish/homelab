---
apiVersion: batch/v1
kind: Job
metadata:
  name: minecraft-backup
  namespace: minecraft
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: backup
          image: alpine:3.23.4
          command:
            - /bin/sh
            - -c
            - |
              apk add --no-cache aws-cli tar
              TIMESTAMP=$(date +%Y%m%d-%H%M%S)
              BACKUP_KEY="backups/game-servers/minecraft/minecraft-${TIMESTAMP}.tar.gz"
              echo "Backing up minecraft world to s3://fabler/${BACKUP_KEY}"
              cd /data
              tar czf /tmp/backup.tar.gz --exclude='*.jar' --exclude='libraries' --exclude='mods' --exclude='versions' .
              FILESIZE=$(du -h /tmp/backup.tar.gz | cut -f1)
              echo "Archive size: ${FILESIZE}"
              aws s3 cp /tmp/backup.tar.gz "s3://fabler/${BACKUP_KEY}"
              echo "Backup complete: ${BACKUP_KEY}"
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: r2-credentials
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: r2-credentials
                  key: secret-access-key
            - name: AWS_ENDPOINT_URL
              value: "https://95c5c6e1c01ea2d0c9fab69ee9e28462.r2.cloudflarestorage.com"
          volumeMounts:
            - name: minecraft-data
              mountPath: /data
              readOnly: true
      volumes:
        - name: minecraft-data
          persistentVolumeClaim:
            claimName: minecraft-data-minecraft-0
