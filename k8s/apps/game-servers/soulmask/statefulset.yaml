---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: soulmask
  namespace: soulmask
spec:
  selector:
    matchLabels:
      app: soulmask
  serviceName: "soulmask"
  replicas: 0
  template:
    metadata:
      labels:
        app: soulmask
    spec:
      # Give Soulmask up to 3 minutes to finish saving on pod termination.
      # entrypoint.sh traps SIGTERM and forwards it to WSServer-Linux-Shipping.
      terminationGracePeriodSeconds: 180
      securityContext:
        fsGroup: 1000
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: soulmask
          image: ghcr.io/idarlafish/soulmask-server:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: soulmask-cm
          env:
            - name: SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: soulmask-secrets
                  key: serverPassword
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: soulmask-secrets
                  key: adminPassword
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: soulmask-secrets
                  key: rconPassword
          resources:
            requests:
              cpu: "500m"
              memory: "10Gi"
            limits:
              cpu: "3500m"
              memory: "14Gi"
          ports:
            - name: gameport
              containerPort: 27050
              protocol: UDP
            - name: queryport
              containerPort: 27051
              protocol: UDP
            - name: rconport
              containerPort: 25575
              protocol: TCP
          volumeMounts:
            # PVC holds the whole Soulmask install (game binaries + saves).
            # SteamCMD auto-update runs on every pod start and writes here.
            - name: soulmask-data
              mountPath: /home/steam/soulmask
          startupProbe:
            exec:
              command: ["pgrep", "-f", "WSServer-Linux-Shipping"]
            # Cold start can take 3-5 min on a fresh PVC (SteamCMD download),
            # ~30-60s on subsequent starts. Generous failureThreshold so
            # liveness/readiness don't kick in until the game is up.
            periodSeconds: 10
            failureThreshold: 60  # ~10 min budget for first SteamCMD download
          livenessProbe:
            exec:
              command: ["pgrep", "-f", "WSServer-Linux-Shipping"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["pgrep", "-f", "WSServer-Linux-Shipping"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: soulmask-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 15Gi
        storageClassName: hcloud-volumes
