---
# Needed only to rewrite the /funcom/artifacts hostPath that Funcom's server-operator
# hardcodes onto every Dune game pod (Talos has a read-only root outside /var, and the
# CRD exposes no override). Admission controller only — the background, cleanup and
# reports controllers are not used and would just cost memory on a single-node cluster.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 30m
  chart:
    spec:
      chart: kyverno
      version: "3.7.1"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
  values:
    backgroundController:
      enabled: false
    cleanupController:
      enabled: false
    reportsController:
      enabled: false
    admissionController:
      replicas: 1
      container:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
