---
# The ClusterRoles themselves ship in the Steam depot (crds/rbac-update.yaml) and are
# applied by the bootstrap Job — Funcom's content is never vendored into this repo.
# Everything below is ours: identities and bindings onto those roles.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: battlegroupoperator-controller-manager
  namespace: funcom-operators
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: battlegroupoperator-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: battlegroupoperator-manager-role
subjects:
  - kind: ServiceAccount
    name: battlegroupoperator-controller-manager
    namespace: funcom-operators
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: battlegroupoperator-leader-election-role
  namespace: funcom-operators
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events, configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: battlegroupoperator-leader-election-rolebinding
  namespace: funcom-operators
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: battlegroupoperator-leader-election-role
subjects:
  - kind: ServiceAccount
    name: battlegroupoperator-controller-manager
    namespace: funcom-operators
---
