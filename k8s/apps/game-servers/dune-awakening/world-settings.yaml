---
# Gameplay settings. Authored as plain ini for reviewability; the bootstrap render step
# translates each key into an -ini: command-line override on every ServerSet.
#
# Mounting these as files does not work - Unreal's Saved/Config layer lives on the world
# PVC and outranks the user-config layer, so first-boot values shadow them permanently.
#
# Directions are NOT consistent across keys — always check the depot's own comment in
# scripts/setup/config/ before adding one. Known traps:
#   LootRespawnSpeed   higher = SLOWER ("loot chests take longer to spawn back")
#   ResourceRespawnSpeed  higher = FASTER ("resources respawn sooner")
#   WaterExtractionRate   higher = SLOWER ("extraction takes longer")
#
# The server login password is deliberately NOT here: it lives in the SOPS secret and is
# injected as an -ini: argument, so this file stays safe to read in a public repo.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dune-world-settings
  namespace: dune-awakening
data:
  # Every key below is ignored unless DifficultyLevel=Custom.
  UserServerCustomSettings.ini: |
    [/Script/DuneSandbox.UserServerCustomSettings]
    DifficultyLevel=Custom

    ; --- carrying and progression ---
    ; Depot documents 0.1-10; 50 is an experiment - check the UI reads 50, not 10 or 1.
    InventoryVolumeMultiplier=50.000000
    ; Per-source XP: the settings screen reads these, not GlobalXpMultiplier.
    CombatXp=2.000000
    GatheringXp=2.000000
    MissionXp=2.000000
    LandsraadSpecializationXpMultiplier=2.000000
    LandsraadContributionMultiplier=2.000000
    LandsraadFactionStandingMultiplier=2.000000
    IntelPointsGainMultiplier=2.000000

    ; --- crafting and resources ---
    ; In-game "mining efficiency"; 10 is the max.
    GatheringAmount=10.000000
    CraftingTimeMultiplier=0.500000
    CraftingCost=0.500000
    BuildingCostMultiplier=0.500000
    ; Higher = fuel lasts longer.
    FuelBurnTimeMultiplier=5.000000
    ResourceRespawnSpeed=2.000000

    ; --- survival pressure ---
    ThirstMultiplier=0.100000
    HeatBuildupRate=0.100000

    ; --- gear retention ---
    ItemDurabilityDrainMultiplier=0.100000
    bEnableItemMaxDurabilityLoss=False
    ; Normal death and sandworm are separate systems; both needed.
    DropEquipmentOnDeath=None
    SandwormConsequences=None

    ; --- bases ---
    ; Environmental only, not PvP raiding.
    bAllowDynamicBuildingDamage=False
    FiefdomLimit=10
    ; Pieces of one category per fief; 1.0 is the UI's cap.
    BuildingPieceLimitMultiplier=10.000000
    ; Hours (engine default 10).
    BaseBackupToolTimeRestriction=0.020000
  # Console variables only; gameplay multipliers do not work through this route.
  UserEngine.ini: |
    [ConsoleVariables]
    ; Already the shipped default; pinned so a future build cannot re-enable it.
    BattlEye.Enabled=false
