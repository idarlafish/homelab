---
# Funcom's operators, reconstructed as plain Deployments. The depot only ships the
# images; its installer creates these inside its own k3s, so we declare them here.
# No {Mutating,Validating}WebhookConfiguration is created — nothing calls :9443 — but
# each operator still mounts a serving cert, generated by the bootstrap Job.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: battlegroupoperator-controller-manager
  namespace: funcom-operators
  labels:
    control-plane: battlegroup-controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: battlegroup-controller-manager
  template:
    metadata:
      labels:
        control-plane: battlegroup-controller-manager
    spec:
      serviceAccountName: battlegroupoperator-controller-manager
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: manager
          image: registry.funcom.com/funcom/self-hosting/igw-k8s-battlegroup-operator:v1.7.0
          imagePullPolicy: IfNotPresent
          command: [/app/operator]
          args:
            - --leader-elect
            - --zap-devel=false
            - --zap-log-level=info
            - --zap-time-encoding=iso8601
            - --database-default-port=15432
            - --filebrowser-default-port=18888
            - --pghero-default-port=21111
            - --bg-max-concurrent=2
            - --dr-max-concurrent=2
            - --sr-max-concurrent=2
            - --cfo-taints-ignore=node.kubernetes.io/unschedulable,node.funcom.com/new
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          ports:
            - containerPort: 9443
              name: webhook-server
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - name: cert
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
      volumes:
        - name: cert
          secret:
            secretName: battlegroupoperator-webhook-server-cert
