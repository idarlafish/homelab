---
# Fetches everything Funcom owns at run time rather than vendoring it: the server images,
# the 26 CRDs, the four ClusterRoles and the world template all come from Steam depot
# 4754530, which this public repo must not redistribute.
#
# Re-run on every game patch: a server left on an old build is silently dropped from the
# in-game Experimental tab (see README).
#
# Keyed on the game build: it only re-runs when DUNE_SERVER_BUILD changes. Shell ${...}
# is written $${...} so Flux postBuild substitution leaves it for the shell.
# The world itself is rendered by dune-apply-job.yaml, which is cheap to re-run.
apiVersion: batch/v1
kind: Job
metadata:
  name: dune-bootstrap-2134304-0-shipping
  namespace: dune-awakening
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: dune-bootstrap
      securityContext:
        runAsUser: 0
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # Anonymous Steam login is enough; owning the game only matters for the FLS token.
        # A wedged appmanifest (StateFlags 6) makes app_update report success while doing
        # nothing, so it is removed first; app_license_request and app_info_update are both
        # required or a fresh install fails with "Missing configuration".
        - name: depot
          image: steamcmd/steamcmd:ubuntu-24
          command: [bash, -c]
          args:
            - |
              set -euo pipefail
              mkdir -p /depot/server
              rm -f /depot/server/steamapps/appmanifest_4754530.acf
              # Prime the appinfo cache in its own run: doing this in the same invocation
              # as app_update makes a fresh install fail with "Missing configuration".
              steamcmd +@ShutdownOnFailedCommand 0 +@NoPromptForPassword 1 +login anonymous \
                +app_license_request 4754530 +app_info_update 1 \
                +app_info_print 4754530 +quit >/dev/null 2>&1 || true
              steamcmd +@ShutdownOnFailedCommand 0 +@NoPromptForPassword 1 \
                +@sSteamCmdForcePlatformType linux +force_install_dir /depot/server \
                +login anonymous +app_license_request 4754530 +app_info_update 1 \
                +app_update 4754530 validate +quit
              build="$$(cat /depot/server/images/battlegroup/version.txt)"
              echo "depot build: $$build / expected: 2134304-0-shipping"
              if [ "$$build" != "2134304-0-shipping" ]; then
                echo "BUILD MISMATCH - bump DUNE_SERVER_BUILD in the cluster ResourceSet" >&2
                exit 1
              fi
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {memory: 3Gi}
          volumeMounts: [{name: depot, mountPath: /depot}]
      containers:
        # Push the tarballs into the in-cluster registry the Talos mirror points at.
        - name: images
          image: quay.io/skopeo/stable@sha256:064d2cefb512c97d5a22979599ca05b7198fd6176494a634e1f31bd6b5fbd77a
          command: [bash, -c]
          args:
            - |
              set -euo pipefail
              cd /depot/server/images
              for t in operators/*.tar prerequisites/igw-postgres.tar battlegroup/*.tar; do
                [ -f "$$t" ] || continue
                ref="$$(tar -xOf "$$t" manifest.json | tr ',' '\n' \
                        | grep -o '"registry\.funcom\.com/[^"]*"' | head -1 | tr -d '"')"
                if [ -z "$$ref" ]; then echo "no RepoTag in $$t, skipping"; continue; fi
                echo "push $$ref"
                skopeo copy -q --dest-tls-verify=false \
                  docker-archive:"$$t" "docker://10.0.96.200:5000/$${ref#registry.funcom.com/}"
              done
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {memory: 4Gi}
          volumeMounts: [{name: depot, mountPath: /depot}]
      volumes:
        - name: depot
          persistentVolumeClaim: {claimName: depot}
