---
# Renders Funcom's world-template.yaml (from the Steam depot) into a BattleGroup using our
# values. Equivalent to their scripts/setup/world.sh sed pass, plus the edits this cluster
# needs. Kept in a ConfigMap so the Job stays readable and the logic is reviewable.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dune-render-script
  namespace: dune-awakening
data:
  render.py: |
    import json, os, re, pathlib, ssl, urllib.request, yaml

    SA = "/var/run/secrets/kubernetes.io/serviceaccount"


    def node_external_ip():
        """Read the node's public IPv4 from the API.

        Hetzner hands out a new address whenever the cluster is rebuilt, so this must
        never be baked into git: clients are told this IP via FLS, and a stale one makes
        the world unjoinable.
        """
        token = pathlib.Path(f"{SA}/token").read_text()
        ctx = ssl.create_default_context(cafile=f"{SA}/ca.crt")
        req = urllib.request.Request(
            "https://kubernetes.default.svc/api/v1/nodes",
            headers={"Authorization": f"Bearer {token}"},
        )
        with urllib.request.urlopen(req, context=ctx, timeout=30) as r:
            nodes = json.load(r)["items"]
        for n in nodes:
            for a in n["status"]["addresses"]:
                if a["type"] == "ExternalIP":
                    return a["address"]
        raise SystemExit("no node ExternalIP found - cannot advertise a reachable address")


    src = pathlib.Path("/depot/server/scripts/setup/templates/world-template.yaml")
    text = src.read_text()
    env = os.environ
    world = env["DUNE_WORLD_NAME"]

    public_ip = env["DUNE_PUBLIC_IP"]
    if public_ip in ("", "auto"):
        public_ip = node_external_ip()
    print("advertising public IP:", public_ip)

    subs = {
        "{WORLD_NAME}":          env["DUNE_WORLD_TITLE"],
        "{WORLD_UNIQUE_NAME}":   world,
        "{WORLD_REGION}":        env["DUNE_WORLD_REGION"],
        "{WORLD_IMAGE_TAG}":     env["DUNE_SERVER_BUILD"],
        "{WORLD_POSTGRES_PASS}": env["DUNE_DB_SUPER_PASSWORD"],
        "{WORLD_DUNE_PASS}":     env["DUNE_DB_PASSWORD"],
        "{FLS_SECRET}":          env["DUNE_FLS_TOKEN"],
    }
    for k, v in subs.items():
        text = text.replace(k, v)

    leftover = set(re.findall(r"\{[A-Z0-9_]+\}", text))
    assert not leftover, f"unsubstituted placeholders: {leftover}"

    doc = yaml.safe_load(text)
    spec = doc["spec"]

    # Talos runs no local-path provisioner; use the Hetzner CSI class.
    for store in (spec["database"]["storage"], spec["storage"]):
        store["class"] = env["DUNE_STORAGE_CLASS"]

    sets = spec["serverGroup"]["template"]["spec"]["sets"]
    always_on = json.loads(env["DUNE_ALWAYS_ON_MAPS"])
    pw_arg = "-ini:engine:[ConsoleVariables]:Bgd.ServerLoginPassword=" + env["DUNE_SERVER_PASSWORD"]

    # Gameplay settings ship as plain ini in the dune-world-settings ConfigMap and are
    # mounted where Funcom's own apply-default-usersettings puts them. The password stays
    # out of here (it is an -ini: argument) so the ConfigMap is safe in a public repo.
    settings_dir = pathlib.Path("/settings")
    ini_files = {
        f.name: f.read_text()
        for f in sorted(settings_dir.glob("*.ini"))
    } if settings_dir.is_dir() else {}
    user_ini = {
        "mountPath": "/home/dune/server/DuneSandbox/Saved/UserSettings",
        "files": ini_files,
    } if ini_files else None
    print("mounting ini files:", sorted(ini_files))

    for s in sets:
        # Funcom's bundled k3s ships a memory-focused scheduler we do not run.
        s.pop("schedulerName", None)
        mem = always_on.get(s["map"])
        s["replicas"] = 1 if mem else 0
        if mem:
            s.setdefault("resources", {}).setdefault("limits", {})["memory"] = mem
        # Every set, so a map spawned on demand inherits the password too.
        args = s.setdefault("arguments", [])
        if not any("ServerLoginPassword" in a for a in args):
            args.append(pw_arg)
        if user_ini:
            s["userIniConfig"] = user_ini

    # The template hardcodes 127.0.0.1 in several places; clients need a reachable address.
    def fix_ip(node):
        if isinstance(node, dict):
            for k, v in node.items():
                if k == "envVars" and isinstance(v, list):
                    for e in v:
                        if e.get("name") == "HOST_DATACENTER_IP_ADDRESS":
                            e["value"] = public_ip
                else:
                    fix_ip(v)
        elif isinstance(node, list):
            for v in node:
                fix_ip(v)

    fix_ip(spec)

    # Created stopped: starting a world costs money, so it is a deliberate action.
    spec["stop"] = True
    doc["metadata"]["namespace"] = "funcom-seabass-" + world

    pathlib.Path("/shared/battlegroup.yaml").write_text(yaml.safe_dump(doc, sort_keys=False))
    print("rendered", doc["kind"], doc["metadata"]["name"], "build", env["DUNE_SERVER_BUILD"])
