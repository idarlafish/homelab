---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: palworld
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/apps/game-servers/palworld
  prune: true
  # wait: false — palworld has a standalone PVC (not in a StatefulSet
  # volumeClaimTemplate). At replicas: 0 with WaitForFirstConsumer binding,
  # the PVC stays Pending forever, which would make wait: true time out.
  # Once palworld is scaled to 1, the PVC binds and the deployment becomes
  # healthy normally.
  wait: false
  timeout: 5m
  dependsOn:
    - name: infrastructure
    - name: secrets
