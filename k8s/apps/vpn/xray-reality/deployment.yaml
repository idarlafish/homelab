apiVersion: apps/v1
kind: Deployment
metadata:
  name: xray-reality
  namespace: vpn
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: xray-reality
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xray-reality
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        - name: config-templater
          image: busybox:1.37
          command: ["sh", "-c"]
          args:
            - |
              sed -e "s|XRAY_UUID_PLACEHOLDER|$XRAY_UUID|g" \
                  -e "s|XRAY_PRIVATE_KEY_PLACEHOLDER|$XRAY_PRIVATE_KEY|g" \
                  -e "s|XRAY_SHORT_ID_PLACEHOLDER|$XRAY_SHORT_ID|g" \
                  /etc/xray-template/config.json > /etc/xray/config.json
          env:
            - name: XRAY_UUID
              valueFrom:
                secretKeyRef:
                  name: xray-reality-secrets
                  key: uuid
            - name: XRAY_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: xray-reality-secrets
                  key: private-key
            - name: XRAY_SHORT_ID
              valueFrom:
                secretKeyRef:
                  name: xray-reality-secrets
                  key: short-id
          volumeMounts:
            - name: config-template
              mountPath: /etc/xray-template
              readOnly: true
            - name: config
              mountPath: /etc/xray
      containers:
        - name: xray
          image: ghcr.io/xtls/xray-core:26.5.3
          args: ["run", "-config", "/etc/xray/config.json"]
          ports:
            - containerPort: 443
              name: vless
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: vless
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 1
          readinessProbe:
            tcpSocket:
              port: vless
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 1
          startupProbe:
            tcpSocket:
              port: vless
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 1
          securityContext:
            runAsUser: 0
            capabilities:
              add:
                - NET_BIND_SERVICE
          volumeMounts:
            - name: config
              mountPath: /etc/xray
              readOnly: true
      volumes:
        - name: config-template
          configMap:
            name: xray-reality-config
        - name: config
          emptyDir: {}
