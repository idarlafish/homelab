---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
  namespace: files
  labels:
    app: filebrowser
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: filebrowser
  template:
    metadata:
      labels:
        app: filebrowser
    spec:
      # Run as root to match books PVC ownership (booklore writes as UID 0,
      # and the NFS bridge passes those UIDs through).
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: filebrowser
          image: gtstef/filebrowser:1.3.0-stable-slim
          ports:
            - name: http
              containerPort: 80
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          env:
            - name: FILEBROWSER_CONFIG
              value: /etc/filebrowser/config.yaml
            - name: FILEBROWSER_DATABASE
              value: /home/filebrowser/data/database.db
            - name: FILEBROWSER_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: filebrowser-oidc
                  key: clientId
            - name: FILEBROWSER_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: filebrowser-oidc
                  key: clientSecret
          volumeMounts:
            - name: config
              mountPath: /etc/filebrowser
              readOnly: true
            - name: data
              mountPath: /home/filebrowser/data
            - name: books
              mountPath: /srv/books
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: filebrowser-config
        - name: data
          emptyDir: {}
        - name: books
          persistentVolumeClaim:
            claimName: master-books
