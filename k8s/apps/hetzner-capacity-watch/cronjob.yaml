---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: capacity-watch
  namespace: capacity-watch
spec:
  # Stock is expected to appear briefly, so poll often.
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: watch
              image: python:3.13-alpine
              command: [python3, /app/watch.py]
              env:
                - {name: TARGET_TYPE, value: cx53}
                - {name: LOCATIONS, value: "fsn1 nbg1 hel1"}
                - {name: SERVER_NAME, value: game-servers-cp-1}
                - {name: REPO, value: idarlafish/homelab}
                - {name: VARS_PATH, value: infra/game-servers/variables.tf}
                - {name: WORKFLOW, value: resize-node.yaml}
              envFrom:
                - secretRef: {name: capacity-watch}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: ["ALL"]}
                readOnlyRootFilesystem: true
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 128Mi}
              volumeMounts:
                - {name: app, mountPath: /app, readOnly: true}
          volumes:
            - name: app
              configMap: {name: capacity-watch}
