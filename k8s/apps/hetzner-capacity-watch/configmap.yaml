---
# Claims cx53 capacity for the game-servers node the moment Hetzner has any.
#
# cx53 (16c/32GB, EUR 35/mo) has been out of stock in every EU location for months,
# so game-servers runs cpx52 at EUR 120/mo for 8GB less RAM. When stock appears it is
# expected to be brief, hence the 5-minute poll.
#
# The switch goes through git, not a direct apply: this commits the new server_type to
# variables.tf and then dispatches deploy-infra. Applying with -var instead would leave
# git saying cpx52, so the next apply would resize the node straight back down.
#
# deploy-infra stays dispatch-only rather than gaining a push trigger, which would race
# a local tofu apply on routine hand edits.
#
# Only the node's OWN location counts: a resize cannot move a server between
# datacenters, so stock in nbg1 is useless to a server in fsn1.
#
# Self-limiting: it exits once the node is cx53. Until then it re-dispatches whenever
# capacity exists, because an apply can fail (no capacity by the time it runs, a bad
# runner) and a one-shot guard would leave git permanently ahead of the node.
apiVersion: v1
kind: ConfigMap
metadata:
  name: capacity-watch
  namespace: capacity-watch
data:
  watch.py: |
    import json, os, sys, base64, urllib.request, urllib.error

    TYPE      = os.environ["TARGET_TYPE"]
    SERVER    = os.environ["SERVER_NAME"]
    REPO      = os.environ["REPO"]
    VARS_PATH = os.environ["VARS_PATH"]
    WORKFLOW  = os.environ["WORKFLOW"]
    HCLOUD    = os.environ["HCLOUD_TOKEN"]
    GH        = os.environ["GH_TOKEN"]


    def req(url, token, scheme="Bearer", data=None, method=None, accept=None):
        r = urllib.request.Request(url, method=method)
        r.add_header("Authorization", f"{scheme} {token}")
        if accept:
            r.add_header("Accept", accept)
        if data is not None:
            r.add_header("Content-Type", "application/json")
            data = json.dumps(data).encode()
        with urllib.request.urlopen(r, data=data, timeout=30) as resp:
            body = resp.read()
            return resp.status, (json.loads(body) if body else {})


    def log(msg):
        print(msg, flush=True)


    # 1. Already achieved? Then there is nothing to do, ever again.
    _, servers = req(f"https://api.hetzner.cloud/v1/servers?name={SERVER}", HCLOUD)
    found = servers.get("servers") or []
    if not found:
        log(f"server {SERVER} does not exist (cluster destroyed?) - nothing to do")
        sys.exit(0)
    current = found[0]["server_type"]["name"]
    location = found[0]["location"]["name"]
    if current == TYPE:
        log(f"{SERVER} is already {TYPE} - goal reached, standing down")
        sys.exit(0)

    # 2. Stock in the node's own location? Anywhere else is unusable for a resize.
    _, st = req(f"https://api.hetzner.cloud/v1/server_types?name={TYPE}", HCLOUD)
    types = st.get("server_types") or []
    if not types:
        log(f"unknown server type {TYPE}")
        sys.exit(1)
    here = [l for l in types[0]["locations"] if l["name"] == location]
    if not (here and here[0]["available"]):
        elsewhere = sorted(l["name"] for l in types[0]["locations"] if l["available"])
        log(f"{TYPE} unavailable in {location} (node is {current})"
            + (f"; available in {elsewhere} but a resize cannot change location"
               if elsewhere else ""))
        sys.exit(0)

    log(f"{TYPE} AVAILABLE in {location} - claiming it")

    # 3. Don't pile dispatches onto a run that is already going.
    _, runs = req(f"https://api.github.com/repos/{REPO}/actions/workflows/{WORKFLOW}"
                  "/runs?per_page=5", GH, accept="application/vnd.github+json")
    if any(r["status"] in ("queued", "in_progress") for r in runs.get("workflow_runs", [])):
        log(f"a {WORKFLOW} run is already in flight - leaving it alone")
        sys.exit(0)

    # 4. Record the desired state, unless a previous attempt already did.
    _, f = req(f"https://api.github.com/repos/{REPO}/contents/{VARS_PATH}", GH,
               accept="application/vnd.github+json")
    content = base64.b64decode(f["content"]).decode()

    import re
    new = re.sub(r'(variable "server_type".*?default\s*=\s*)"[^"]+"',
                 rf'\1"{TYPE}"', content, count=1, flags=re.S)
    if new != content:
        req(f"https://api.github.com/repos/{REPO}/contents/{VARS_PATH}", GH, method="PUT",
            accept="application/vnd.github+json",
            data={"message": f"feat(game-servers): claim {TYPE} capacity\n\n"
                              f"{TYPE} became available in {location}. Switching from "
                              f"{current}: same disk (keep_disk), 8GB more RAM, "
                              "EUR 85/mo cheaper.\n\n"
                              "Committed automatically by the capacity watch.",
                  "content": base64.b64encode(new.encode()).decode(),
                  "sha": f["sha"]})
        log(f"committed {TYPE} to {VARS_PATH}")
    elif f'"{TYPE}"' in content:
        log(f"{VARS_PATH} already requests {TYPE} - re-dispatching")
    else:
        log("could not rewrite server_type default - aborting rather than guessing")
        sys.exit(1)

    # 5. Let the existing pipeline realise it. A failure here leaves git ahead of the
    #    node, so fail loudly rather than exiting 0.
    req(f"https://api.github.com/repos/{REPO}/actions/workflows/{WORKFLOW}/dispatches", GH,
        method="POST", accept="application/vnd.github+json",
        data={"ref": "main", "inputs": {"target": "game-servers"}})
    log(f"dispatched {WORKFLOW} - the node will resize to {TYPE}, then kubelet restarts "
        "so the new capacity is advertised")
