apiVersion: v1
kind: Service
metadata:
  name: tika
  namespace: paperless
spec:
  ports:
    - port: 9998
      targetPort: 9998
      name: http
  selector:
    app: tika
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tika
  namespace: paperless
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tika
  template:
    metadata:
      labels:
        app: tika
    spec:
      containers:
        - name: tika
          image: apache/tika:3.3.1.0-full
          ports:
            - containerPort: 9998
              name: http
          readinessProbe:
            httpGet:
              path: /tika
              port: 9998
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /tika
              port: 9998
            initialDelaySeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
