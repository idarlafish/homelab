---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
  namespace: shared-secrets
spec:
  interval: 30m
  chart:
    spec:
      chart: reflector
      version: ">=10.0.0 <11.0.0"
      sourceRef:
        kind: HelmRepository
        name: emberstack
        namespace: flux-system
  values:
    resources:
      requests:
        cpu: 5m
        memory: 64Mi
      limits:
        memory: 128Mi
