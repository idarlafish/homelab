---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pocket-id
  namespace: identity
  labels:
    # Required so kube-prometheus-stack's Prometheus picks this up
    # (its serviceMonitorSelector is matchLabels: { release: kube-prometheus-stack })
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: pocket-id
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
