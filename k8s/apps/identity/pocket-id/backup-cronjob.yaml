---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pocket-id-backup
  namespace: identity
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: alpine:3.23.4
              command: ["sh", "-c"]
              args:
                - |
                  set -e
                  apk add --no-cache aws-cli tar
                  TS=$(date -u +%Y%m%d-%H%M%S)
                  DOW=$(date -u +%u)
                  echo "==> tar /pvc"
                  tar czf /tmp/backup.tar.gz -C /pvc .
                  du -h /tmp/backup.tar.gz
                  aws s3 cp /tmp/backup.tar.gz \
                    "s3://fabler/backups/${CLUSTER_NAME}/pocket-id/daily/${TS}.tar.gz" \
                    --endpoint-url "$AWS_ENDPOINT_URL"
                  if [ "$DOW" = "7" ]; then
                    aws s3 cp /tmp/backup.tar.gz \
                      "s3://fabler/backups/${CLUSTER_NAME}/pocket-id/weekly/${TS}.tar.gz" \
                      --endpoint-url "$AWS_ENDPOINT_URL"
                  fi
              env:
                - { name: AWS_ACCESS_KEY_ID,     valueFrom: { secretKeyRef: { name: r2-credentials, key: access-key-id }}}
                - { name: AWS_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: r2-credentials, key: secret-access-key }}}
                - { name: AWS_ENDPOINT_URL,      value: "https://95c5c6e1c01ea2d0c9fab69ee9e28462.r2.cloudflarestorage.com" }
              volumeMounts:
                - { name: data, mountPath: /pvc, readOnly: true }
          volumes:
            - { name: data, persistentVolumeClaim: { claimName: pocket-id-data } }
