---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pocket-id-config
  namespace: identity
data:
  # --- Required core ---
  APP_URL: "https://auth.la.fish"
  TRUST_PROXY: "true"
  TRUSTED_PLATFORM: "CF-Connecting-IP"   # HTTP header name, not platform name
  PORT: "1411"

  # --- Database ---
  DB_CONNECTION_STRING: "data/pocket-id.db"

  # --- Onboarding policy ---
  ALLOW_USER_SIGNUPS: "withToken"

  # --- Belt-and-braces (SMTP unconfigured anyway) ---
  EMAIL_ONE_TIME_ACCESS_AS_ADMIN_ENABLED: "false"

  # --- Observability ---
  LOG_LEVEL: "info"
  LOG_JSON: "true"
  METRICS_ENABLED: "true"
  OTEL_METRICS_EXPORTER: "prometheus"
  # Bind Prometheus exporter to 0.0.0.0 so other pods can scrape; defaults to 127.0.0.1
  OTEL_EXPORTER_PROMETHEUS_HOST: "0.0.0.0"

  # --- Privacy / homelab posture ---
  ANALYTICS_DISABLED: "true"
  VERSION_CHECK_DISABLED: "true"

  # --- Audit log retention (default; explicit) ---
  AUDIT_LOG_RETENTION_DAYS: "90"
