---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sleepy-notify-bot
  namespace: telegram
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sleepy-notify-bot
  template:
    metadata:
      labels:
        app: sleepy-notify-bot
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
      - name: bot
        image: ghcr.io/idarlafish/sleepy-notify:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        startupProbe:
          httpGet:
            path: /
            port: 3000
          periodSeconds: 5
          failureThreshold: 12  # 60s startup budget (Bun is fast)
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        env:
        - name: REDIS_HOST
          value: "sleepy-notify-redis"
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: REDIS_PORT
          value: "6379"
        - name: BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: sleepy-bot-secrets
              key: bot-token
        - name: PUBLIC_DOMAIN
          valueFrom:
            secretKeyRef:
              name: sleepy-bot-secrets
              key: public-domain
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi