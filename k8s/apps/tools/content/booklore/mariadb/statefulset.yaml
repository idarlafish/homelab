apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  namespace: booklore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
      - name: mariadb
        image: mariadb:11.4.5
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: booklore-db
              key: mysql-root-password
        - name: MYSQL_DATABASE
          value: booklore
        - name: MYSQL_USER
          value: booklore
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: booklore-db
              key: mysql-password
        ports:
        - containerPort: 3306
          name: mysql
        startupProbe:
          exec:
            command: ["sh", "-c", 'mariadb-admin ping -uroot -p"$MYSQL_ROOT_PASSWORD"']
          periodSeconds: 5
          failureThreshold: 30  # ~2.5 min startup budget (first-init + InnoDB warmup)
        livenessProbe:
          exec:
            command: ["sh", "-c", 'mariadb-admin ping -uroot -p"$MYSQL_ROOT_PASSWORD"']
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          exec:
            command: ["sh", "-c", 'mariadb-admin ping -uroot -p"$MYSQL_ROOT_PASSWORD"']
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
          subPath: mariadb
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: booklore-books
