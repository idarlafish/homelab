apiVersion: apps/v1
kind: Deployment
metadata:
  name: cf-tunnel
  namespace: cloudflared
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: cf-tunnel
  template:
    metadata:
      labels:
        app: cf-tunnel
    spec:
      terminationGracePeriodSeconds: 90
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:2026.3.0
        args:
        - tunnel
        - --config=/etc/cloudflared/config/config.yaml
        - --loglevel=info
        - run
        volumeMounts:
        - name: config
          mountPath: /etc/cloudflared/config
          readOnly: true
        - name: creds
          mountPath: /etc/cloudflared/creds
          readOnly: true
        ports:
        - containerPort: 20241
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /ready
            port: 20241
          initialDelaySeconds: 180
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 2
        readinessProbe:
          httpGet:
            path: /ready
            port: 20241
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: cf-tunnel-config
      - name: creds
        secret:
          secretName: cf-tunnel-secret
---
apiVersion: v1
kind: Service
metadata:
  name: cf-tunnel
  namespace: cloudflared
spec:
  selector:
    app: cf-tunnel
  ports:
  - port: 20241
    targetPort: 20241
