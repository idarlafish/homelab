---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: monitoring
data:
  config.yaml: |
    storage:
      type: sqlite
      path: /data/gatus.db

    ui:
      title: ${CLUSTER_NAME} status
      header: ${CLUSTER_NAME}

    endpoints:
      - name: booklore
        group: ${CLUSTER_NAME}
        url: https://${HOSTNAME_BOOKLORE}/
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 5000"
        alerts:
          - type: telegram
            send-on-resolved: true
            failure-threshold: 3
            success-threshold: 2

      - name: pocket-id
        group: ${CLUSTER_NAME}
        url: https://${HOSTNAME_AUTH}/health
        interval: 60s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: telegram
            send-on-resolved: true
            failure-threshold: 3
            success-threshold: 2

      - name: paperless
        group: ${CLUSTER_NAME}
        url: https://${HOSTNAME_PAPERLESS}/
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 5000"
        alerts:
          - type: telegram
            send-on-resolved: true
            failure-threshold: 3
            success-threshold: 2

      - name: vault
        group: ${CLUSTER_NAME}
        url: https://${HOSTNAME_VAULT}/alive
        interval: 60s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: telegram
            send-on-resolved: true
            failure-threshold: 3
            success-threshold: 2

      - name: grafana
        group: ${CLUSTER_NAME}
        url: https://${HOSTNAME_GRAFANA}/api/health
        interval: 60s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: telegram
            send-on-resolved: true
            failure-threshold: 3
            success-threshold: 2

      - name: prometheus
        group: ${CLUSTER_NAME}
        url: https://${HOSTNAME_PROMETHEUS}/-/healthy
        interval: 60s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: telegram
            send-on-resolved: true
            failure-threshold: 3
            success-threshold: 2

    alerting:
      telegram:
        token: $${TELEGRAM_BOT_TOKEN}
        id: $${TELEGRAM_CHAT_ID}
