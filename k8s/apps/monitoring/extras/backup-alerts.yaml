---
# Three alerts cover the failure modes:
#  - BackupJobFailed:        most recent Job failed (fast — fires in 1m)
#  - BackupCronJobStale:     last successful run > 25h ago (normal staleness)
#  - BackupCronJobNeverRan:  cronjob exists > 25h with no successful run ever
#                            (brand-new-and-broken case; metric is absent)
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backup-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: backups
      rules:
        - alert: BackupJobFailed
          expr: |
            kube_job_status_failed{
              namespace=~"booklore|identity",
              job_name=~"(booklore|pocket-id)-backup-.+"
            } > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Backup Job {{ $labels.namespace }}/{{ $labels.job_name }} failed"
            description: "Most recent run of this backup Job exited non-zero. Check pod logs."

        - alert: BackupCronJobStale
          expr: |
            time() - kube_cronjob_status_last_successful_time{
              namespace=~"booklore|identity",
              cronjob=~"booklore-backup|pocket-id-backup"
            } > 25 * 3600
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Backup CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} has not completed successfully in 25h+"
            description: "Last successful run: {{ $value | humanizeDuration }} ago. Daily 03:00 UTC schedule + 1h grace exhausted. Restore point is now stale."

        - alert: BackupCronJobNeverRan
          expr: |
            (time() - kube_cronjob_created{
              namespace=~"booklore|identity",
              cronjob=~"booklore-backup|pocket-id-backup"
            }) > 25 * 3600
            unless on(namespace, cronjob) kube_cronjob_status_last_successful_time
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Backup CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} has never completed successfully"
            description: "CronJob has existed for {{ $value | humanizeDuration }} with no successful runs. Likely broken from day one."
