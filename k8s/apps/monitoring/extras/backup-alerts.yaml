---
# Velero metric-based alerts. Label-agnostic — any new Schedule is auto-covered.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backup-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: backups
      rules:
        - alert: VeleroBackupFailing
          expr: |
            increase(velero_backup_failure_total[1h]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Velero backup {{ $labels.schedule }} failed"
            description: "Schedule {{ $labels.schedule }} has produced a failed backup in the last hour."

        - alert: VeleroBackupPartialFailure
          expr: |
            increase(velero_backup_partial_failure_total[1h]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Velero backup {{ $labels.schedule }} partially failed"
            description: "Schedule {{ $labels.schedule }} produced a backup with at least one item failure."

        - alert: VeleroBackupStale
          expr: |
            time() - velero_backup_last_successful_timestamp{schedule!=""} > 25 * 3600
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Velero schedule {{ $labels.schedule }} has not completed successfully in 25h+"
            description: "Last successful run: {{ $value | humanizeDuration }} ago."

        - alert: VeleroStorageLocationUnavailable
          expr: |
            velero_backup_storage_location_status{phase!="Available"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Velero BackupStorageLocation {{ $labels.name }} is {{ $labels.phase }}"
            description: "Velero cannot reach R2 — backups will fail until resolved."
