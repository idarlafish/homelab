---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-game-servers
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Homelab
data:
  game-servers.json: |
    {
      "title": "Game Servers",
      "uid": "homelab-game-servers",
      "tags": ["homelab", "games"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "templating": {"list": []},
      "annotations": {"list": []},
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Cluster Reachable",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 0, "y": 0, "w": 6, "h": 4},
          "targets": [{"refId": "A", "expr": "max(up{cluster=\"game-servers\"}) or vector(0)"}],
          "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}, "mappings": [{"type": "value", "options": {"0": {"text": "DOWN", "color": "red"}, "1": {"text": "UP", "color": "green"}}}]}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "graphMode": "none", "textMode": "value"}
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Games Running",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 6, "y": 0, "w": 6, "h": 4},
          "targets": [{"refId": "A", "expr": "count(count by (namespace) (rate(container_cpu_usage_seconds_total{cluster=\"game-servers\", namespace!=\"\", namespace!~\"kube-system|flux-system|cert-manager|metrics\"}[5m]) > 0)) or vector(0)"}],
          "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value", "graphMode": "none", "textMode": "auto"}
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Total CPU (cores)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 12, "y": 0, "w": 6, "h": 4},
          "targets": [{"refId": "A", "expr": "sum(rate(container_cpu_usage_seconds_total{cluster=\"game-servers\", namespace!=\"\", namespace!~\"kube-system|flux-system|cert-manager|metrics\", container!=\"\"}[5m])) or vector(0)"}],
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 2}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value", "graphMode": "area", "textMode": "auto"}
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Total Memory",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 18, "y": 0, "w": 6, "h": 4},
          "targets": [{"refId": "A", "expr": "sum(container_memory_working_set_bytes{cluster=\"game-servers\", namespace!=\"\", namespace!~\"kube-system|flux-system|cert-manager|metrics\", container!=\"\"}) or vector(0)"}],
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value", "graphMode": "area", "textMode": "auto"}
        },
        {
          "id": 10,
          "type": "table",
          "title": "Per-Game Status (live)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 0, "y": 4, "w": 24, "h": 8},
          "targets": [
            {"refId": "A", "expr": "sum by (namespace) (rate(container_cpu_usage_seconds_total{cluster=\"game-servers\", namespace!=\"\", namespace!~\"kube-system|flux-system|cert-manager|metrics\", container!=\"\"}[5m]))", "format": "table", "instant": true, "legendFormat": "CPU"},
            {"refId": "B", "expr": "sum by (namespace) (container_memory_working_set_bytes{cluster=\"game-servers\", namespace!=\"\", namespace!~\"kube-system|flux-system|cert-manager|metrics\", container!=\"\"})", "format": "table", "instant": true, "legendFormat": "Memory"}
          ],
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": [
            {"matcher": {"id": "byName", "options": "Value #A"}, "properties": [{"id": "displayName", "value": "CPU (cores)"}, {"id": "decimals", "value": 3}]},
            {"matcher": {"id": "byName", "options": "Value #B"}, "properties": [{"id": "displayName", "value": "Memory"}, {"id": "unit", "value": "bytes"}]}
          ]},
          "options": {"showHeader": true}
        },
        {
          "id": 20,
          "type": "timeseries",
          "title": "CPU per Game (cores)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 0, "y": 12, "w": 12, "h": 8},
          "targets": [{"refId": "A", "expr": "sum by (namespace) (rate(container_cpu_usage_seconds_total{cluster=\"game-servers\", namespace!=\"\", namespace!~\"kube-system|flux-system|cert-manager|metrics\", container!=\"\"}[5m]))", "legendFormat": "{{namespace}}"}],
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 2, "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 20, "stacking": {"mode": "normal"}}}, "overrides": []},
          "options": {"legend": {"showLegend": true, "displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 21,
          "type": "timeseries",
          "title": "Memory per Game",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 12, "y": 12, "w": 12, "h": 8},
          "targets": [{"refId": "A", "expr": "sum by (namespace) (container_memory_working_set_bytes{cluster=\"game-servers\", namespace!=\"\", namespace!~\"kube-system|flux-system|cert-manager|metrics\", container!=\"\"})", "legendFormat": "{{namespace}}"}],
          "fieldConfig": {"defaults": {"unit": "bytes", "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 20, "stacking": {"mode": "normal"}}}, "overrides": []},
          "options": {"legend": {"showLegend": true, "displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 22,
          "type": "timeseries",
          "title": "Network Egress per Game (player traffic out)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 0, "y": 20, "w": 12, "h": 8},
          "targets": [{"refId": "A", "expr": "sum by (namespace) (rate(container_network_transmit_bytes_total{cluster=\"game-servers\", namespace!=\"\", namespace!~\"kube-system|flux-system|cert-manager|metrics\"}[5m]))", "legendFormat": "{{namespace}}"}],
          "fieldConfig": {"defaults": {"unit": "Bps", "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 10}}, "overrides": []},
          "options": {"legend": {"showLegend": true, "displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 23,
          "type": "timeseries",
          "title": "Network Ingress per Game (player traffic in)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 12, "y": 20, "w": 12, "h": 8},
          "targets": [{"refId": "A", "expr": "sum by (namespace) (rate(container_network_receive_bytes_total{cluster=\"game-servers\", namespace!=\"\", namespace!~\"kube-system|flux-system|cert-manager|metrics\"}[5m]))", "legendFormat": "{{namespace}}"}],
          "fieldConfig": {"defaults": {"unit": "Bps", "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 10}}, "overrides": []},
          "options": {"legend": {"showLegend": true, "displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 30,
          "type": "timeseries",
          "title": "Activity Heatmap (any game running, last 30d)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 0, "y": 28, "w": 24, "h": 8},
          "targets": [{"refId": "A", "expr": "count by (namespace) (rate(container_cpu_usage_seconds_total{cluster=\"game-servers\", namespace!=\"\", namespace!~\"kube-system|flux-system|cert-manager|metrics\", container!=\"\"}[5m]) > 0)", "legendFormat": "{{namespace}}"}],
          "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "bars", "lineWidth": 1, "fillOpacity": 80, "stacking": {"mode": "normal"}}}, "overrides": []},
          "options": {"legend": {"showLegend": true, "displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
        }
      ]
    }
