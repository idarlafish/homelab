---
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-git-sync-bootstrap
  namespace: monitoring
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: grafana-git-sync
      automountServiceAccountToken: false
      containers:
        - name: bootstrap
          image: alpine:3.24
          env:
            - name: GRAFANA_SERVER
              value: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local
            - name: GIT_PAT
              valueFrom:
                secretKeyRef:
                  name: git-sync-pat
                  key: token
          volumeMounts:
            - name: manifests
              mountPath: /etc/manifests
              readOnly: true
            - name: workdir
              mountPath: /work
            - name: grafana-token
              mountPath: /var/run/secrets/grafana
              readOnly: true
          command:
            - sh
            - -ceu
            - |
              apk add --no-cache curl gettext

              for i in $(seq 1 30); do
                curl -fsS -o /dev/null "$GRAFANA_SERVER/api/health" && break
                sleep 5
              done

              GRAFANA_TOKEN=$(cat /var/run/secrets/grafana/token)
              API="$GRAFANA_SERVER/apis/provisioning.grafana.app/v1beta1/namespaces/default/repositories"

              STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                -H "Authorization: Bearer $GRAFANA_TOKEN" \
                "$API/tools-dashboards")
              if [ "$STATUS" = "200" ]; then
                echo "Repository tools-dashboards already exists, nothing to do"
                exit 0
              fi

              envsubst '$${GIT_PAT}' < /etc/manifests/repository.json > /work/repository.json

              RESP=$(curl -s -w "\n%{http_code}" -X POST \
                -H "Authorization: Bearer $GRAFANA_TOKEN" \
                -H "Content-Type: application/json" \
                "$API" -d @/work/repository.json)
              CODE=$(echo "$RESP" | tail -n1)
              BODY=$(echo "$RESP" | sed '$d')
              echo "HTTP $CODE: $BODY"

              case "$CODE" in
                200|201) echo "Repository created"; exit 0 ;;
                *) echo "Failed: HTTP $CODE"; exit 1 ;;
              esac
      volumes:
        - name: manifests
          configMap:
            name: grafana-git-sync-manifests
        - name: workdir
          emptyDir: {}
        - name: grafana-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: grafana
                  expirationSeconds: 3600
