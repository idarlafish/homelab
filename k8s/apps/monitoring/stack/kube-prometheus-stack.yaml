---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "<85.0.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    prometheusOperator:
      resources:
        requests:
          cpu: 1m
          memory: 32Mi
        limits:
          memory: 128Mi
    prometheus:
      prometheusSpec:
        retention: 14d
        resources:
          requests:
            cpu: 1m
            memory: 256Mi
          limits:
            memory: 512Mi
        enableRemoteWriteReceiver: true
        externalLabels:
          cluster: tools
        storageSpec:
          volumeClaimTemplate:
            metadata:
              name: db
            spec:
              accessModes: [ReadWriteOnce]
              storageClassName: hcloud-volumes-encrypted
              resources:
                requests:
                  storage: 10Gi
    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      envFromSecret: grafana-oidc
      grafana.ini:
        feature_toggles:
          enable: kubernetesDashboards
        server:
          root_url: https://${HOSTNAME_GRAFANA}/
        security:
          disable_initial_admin_creation: true
        auth:
          oauth_allow_insecure_email_lookup: true
          disable_login_form: true
          oauth_auto_login: false
        auth.generic_oauth:
          enabled: true
          name: Pocket-ID
          allow_sign_up: true
          auto_login: false
          allow_assign_grafana_admin: true
          scopes: openid email profile groups
          empty_scopes: false
          email_attribute_path: "email"
          login_attribute_path: "preferred_username"
          name_attribute_path: "name"
          role_attribute_path: "contains(groups[*], 'admin') && 'GrafanaAdmin' || 'Viewer'"
          auth_url: https://${HOSTNAME_AUTH}/authorize
          token_url: https://${HOSTNAME_AUTH}/api/oidc/token
          api_url: https://${HOSTNAME_AUTH}/api/oidc/userinfo
          use_pkce: true
      persistence:
        enabled: true
        size: 10Gi
      resources:
        requests:
          cpu: 1m
          memory: 128Mi
        limits:
          memory: 256Mi
    alertmanager:
      enabled: true
      alertmanagerSpec:
        alertmanagerConfigSelector:
          matchLabels:
            release: kube-prometheus-stack
        alertmanagerConfigMatcherStrategy:
          type: None
        resources:
          requests:
            cpu: 1m
            memory: 32Mi
          limits:
            memory: 96Mi
    nodeExporter:
      resources:
        requests:
          cpu: 1m
          memory: 32Mi
        limits:
          memory: 64Mi
    kube-state-metrics:
      resources:
        requests:
          cpu: 1m
          memory: 32Mi
        limits:
          memory: 64Mi
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeProxy:
      enabled: false
