---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "<85.0.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    prometheusOperator:
      resources:
        requests:
          cpu: 1m
          memory: 32Mi
        limits:
          memory: 128Mi
    prometheus:
      prometheusSpec:
        retention: 14d
        resources:
          requests:
            cpu: 1m
            memory: 256Mi
          limits:
            memory: 512Mi
        enableRemoteWriteReceiver: true
        externalLabels:
          cluster: tools
        storageSpec:
          volumeClaimTemplate:
            metadata:
              name: db
            spec:
              accessModes: [ReadWriteOnce]
              storageClassName: hcloud-volumes-encrypted
              resources:
                requests:
                  storage: 10Gi
    grafana:
      defaultDashboardsEnabled: false
      envFromSecret: grafana-oidc
      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki
          access: proxy
          url: http://loki.monitoring.svc.cluster.local:3100
          isDefault: false
          editable: false
          jsonData:
            timeout: 60
            maxLines: 1000
      grafana.ini:
        feature_toggles:
          enable: kubernetesDashboards
        server:
          root_url: https://${HOSTNAME_GRAFANA}/
        security:
          disable_initial_admin_creation: true
        auth:
          oauth_allow_insecure_email_lookup: true
          disable_login_form: true
          oauth_auto_login: false
        auth.generic_oauth:
          enabled: true
          name: Pocket-ID
          allow_sign_up: true
          auto_login: false
          allow_assign_grafana_admin: true
          scopes: openid email profile groups
          empty_scopes: false
          email_attribute_path: "email"
          login_attribute_path: "preferred_username"
          name_attribute_path: "name"
          role_attribute_path: "contains(groups[*], 'admin') && 'GrafanaAdmin' || 'Viewer'"
          auth_url: https://${HOSTNAME_AUTH}/authorize
          token_url: https://${HOSTNAME_AUTH}/api/oidc/token
          api_url: https://${HOSTNAME_AUTH}/api/oidc/userinfo
          use_pkce: true
        auth.jwt:
          enabled: true
          header_name: Authorization
          expect_claims: '{"aud": ["grafana"]}'
          username_claim: sub
          email_claim: sub
          auto_sign_up: true
          role_attribute_strict: true
          role_attribute_path: "contains(sub, 'system:serviceaccount:monitoring:grafana-git-sync') && 'GrafanaAdmin' || 'None'"
          jwk_set_url: https://kubernetes.default.svc.cluster.local/openid/v1/jwks
          jwk_set_bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          tls_client_ca: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      persistence:
        enabled: true
        size: 10Gi
      resources:
        requests:
          cpu: 1m
          memory: 256Mi
        limits:
          memory: 512Mi
    alertmanager:
      enabled: true
      alertmanagerSpec:
        alertmanagerConfigSelector:
          matchLabels:
            release: kube-prometheus-stack
        alertmanagerConfigMatcherStrategy:
          type: None
        resources:
          requests:
            cpu: 1m
            memory: 32Mi
          limits:
            memory: 96Mi
    nodeExporter:
      resources:
        requests:
          cpu: 1m
          memory: 32Mi
        limits:
          memory: 64Mi
    kube-state-metrics:
      resources:
        requests:
          cpu: 1m
          memory: 32Mi
        limits:
          memory: 64Mi
      rbac:
        extraRules:
          - apiGroups: [velero.io]
            resources: [deletebackuprequests]
            verbs: [get, list, watch]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind:
                  group: velero.io
                  version: v1
                  kind: DeleteBackupRequest
                metricNamePrefix: velero_deletebackuprequest
                labelsFromPath:
                  name: [metadata, name]
                  namespace: [metadata, namespace]
                  backup_name: [spec, backupName]
                metrics:
                  - name: phase
                    help: "DeleteBackupRequest phase"
                    each:
                      type: StateSet
                      stateSet:
                        labelName: phase
                        path: [status, phase]
                        list: [New, InProgress, Processed]
                  - name: created
                    help: "DeleteBackupRequest creationTimestamp as Unix seconds"
                    each:
                      type: Gauge
                      gauge:
                        path: [metadata, creationTimestamp]
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeProxy:
      enabled: false
