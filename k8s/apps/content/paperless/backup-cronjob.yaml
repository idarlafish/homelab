apiVersion: batch/v1
kind: CronJob
metadata:
  name: paperless-backup
  namespace: paperless
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: exporter
              image: ghcr.io/paperless-ngx/paperless-ngx:2.20.15
              command: ["sh", "-c"]
              args:
                - |
                  set -e
                  rm -rf /usr/src/paperless/export/*
                  cd /usr/src/paperless/src
                  python3 manage.py document_exporter -na -nt -f /usr/src/paperless/export
                  echo "Export size: $(du -sh /usr/src/paperless/export | cut -f1)"
              env:
                - name: PAPERLESS_DBHOST
                  value: postgres
                - name: PAPERLESS_DBPORT
                  value: "5432"
                - name: PAPERLESS_DBNAME
                  value: paperless
                - name: PAPERLESS_DBUSER
                  value: paperless
                - name: PAPERLESS_DBPASS
                  valueFrom:
                    secretKeyRef:
                      name: paperless-db
                      key: postgres-password
                - name: PAPERLESS_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: paperless-db
                      key: postgres-password
                - name: PAPERLESS_TIME_ZONE
                  value: "Europe/Oslo"
                - name: PAPERLESS_URL
                  value: "https://${HOSTNAME_PAPERLESS}"
              volumeMounts:
                - name: storage
                  mountPath: /usr/src/paperless/data
                  subPath: data
                - name: storage
                  mountPath: /usr/src/paperless/media
                  subPath: media
                - name: storage
                  mountPath: /usr/src/paperless/consume
                  subPath: consume
                - name: storage
                  mountPath: /usr/src/paperless/export
                  subPath: export
          containers:
            - name: uploader
              image: alpine:3.23.4
              command: ["sh", "-c"]
              args:
                - |
                  set -e
                  apk add --no-cache aws-cli tar
                  TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)
                  DOW=$(date -u +%u)
                  echo "==> tar export"
                  tar czf /tmp/backup.tar.gz -C /export .
                  echo "Archive size: $(du -h /tmp/backup.tar.gz | cut -f1)"
                  echo "==> upload daily"
                  aws s3 cp /tmp/backup.tar.gz \
                    "s3://${BUCKET_NAME}/paperless/daily/$${TIMESTAMP}.tar.gz" \
                    --endpoint-url "$AWS_ENDPOINT_URL"
                  if [ "$DOW" = "7" ]; then
                    echo "==> Sunday: also upload weekly"
                    aws s3 cp /tmp/backup.tar.gz \
                      "s3://${BUCKET_NAME}/paperless/weekly/$${TIMESTAMP}.tar.gz" \
                      --endpoint-url "$AWS_ENDPOINT_URL"
                  fi
                  echo "==> done"
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: r2-credentials
                      key: access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: r2-credentials
                      key: secret-access-key
                - name: AWS_ENDPOINT_URL
                  value: "https://95c5c6e1c01ea2d0c9fab69ee9e28462.r2.cloudflarestorage.com"
              volumeMounts:
                - name: storage
                  mountPath: /export
                  subPath: export
                  readOnly: true
          volumes:
            - name: storage
              persistentVolumeClaim:
                claimName: paperless-storage
