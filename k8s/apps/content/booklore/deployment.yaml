---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booklore
  namespace: booklore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booklore
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: booklore
    spec:
      containers:
      - name: booklore
        image: ghcr.io/grimmory-tools/grimmory:v3.0.2
        env:
        - name: APP_USER_ID
          value: "0"
        - name: APP_GROUP_ID
          value: "0"
        - name: BOOKLORE_PORT
          value: "6060"
        - name: DATABASE_URL
          value: "jdbc:mariadb://mariadb:3306/booklore?createDatabaseIfNotExist=true"
        - name: DATABASE_USERNAME
          value: "booklore"
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: booklore-db
              key: mysql-password
        ports:
        - containerPort: 6060
          name: http
          protocol: TCP
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 6060
          periodSeconds: 5
          failureThreshold: 36  # ~3 min startup budget (Spring Boot + JVM warmup)
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 6060
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 6060
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: /app/data
          subPath: config
        - name: data
          mountPath: /books
          subPath: books
        - name: bookdrop
          mountPath: /bookdrop
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: booklore-books
      - name: bookdrop
        emptyDir: {}