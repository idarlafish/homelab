---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# prune: disabled prevents the cascade when this 'content' Kustomization is
# replaced by per-app inputs (booklore, paperless) — see follow-up commit.
commonAnnotations:
  kustomize.toolkit.fluxcd.io/prune: disabled
resources:
  - namespace.yaml
  - booklore
  - books-nfs
  - paperless
