services:
    bot:
        container_name: sleepy-notify-bot
        restart: unless-stopped
        platform: linux/arm64
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "3000:3000"
        environment:
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - PORT=3000
            - NODE_ENV=production
        env_file:
            - path: ./.env.production
              required: false
        depends_on:
            - ngrok
            - redis

    ngrok:
        image: ngrok/ngrok:latest
        restart: unless-stopped
        command:
            - "http"
            - "http://host.docker.internal:3000"
        env_file:
            - path: ./.env.production
              required: false
        ports:
            - "4040:4040"

    redis:
        container_name: sleepy-notify-redis
        image: redis:7-alpine
        restart: unless-stopped
        command: redis-server --appendonly yes --appendfsync everysec
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5
volumes:
    redis_data:

networks:
    default: {}
