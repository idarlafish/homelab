services:
    redis:
        container_name: sleepy-notify-redis
        image: redis:7-alpine
        restart: unless-stopped
        command: redis-server --appendonly yes --appendfsync everysec
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5

volumes:
    redis_data:
