<!-- public/create.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--tg-theme-bg-color);
      color: var(--tg-theme-text-color);
      padding: 16px;
    }
    
    .header {
      margin-bottom: 24px;
    }
    
    .header h1 {
      font-size: 24px;
      font-weight: 600;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      font-size: 14px;
    }
    
    input[type="time"],
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--tg-theme-hint-color);
      border-radius: 8px;
      font-size: 16px;
      background: var(--tg-theme-secondary-bg-color, rgba(255,255,255,0.05));
      color: var(--tg-theme-text-color);
      font-family: inherit;
    }
    
    textarea {
      min-height: 100px;
      resize: vertical;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📝 Create Reminder</h1>
  </div>

  <div class="form-group">
    <label for="time">⏰ Time</label>
    <input type="time" id="time" value="09:00" required>
  </div>
  
  <div class="form-group">
    <label for="message">💬 Message</label>
    <textarea id="message" placeholder="What should I remind you about?" required></textarea>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    tg.BackButton.show();
    
    const userId = tg.initDataUnsafe?.user?.id;
    const chatId = tg.initDataUnsafe?.user?.id; // Same as userId for private chats
    
    tg.BackButton.onClick(() => {
      window.location.href = '/index.html';
    });
    
    tg.MainButton.setText('Save Reminder');
    tg.MainButton.show();
    
    tg.MainButton.onClick(async () => {
      const time = document.getElementById('time').value;
      const message = document.getElementById('message').value.trim();
      const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
      
      if (!time || !message) {
        tg.showAlert('Please fill all fields');
        return;
      }
      
      tg.MainButton.showProgress();
      
      try {
        const response = await fetch('/api/reminders', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            userId,
            chatId,
            time,
            message,
            timezone
          })
        });
        
        const result = await response.json();
        
        if (response.ok) {
          tg.showPopup({
            message: '✅ Reminder created!',
            buttons: [{ type: 'ok' }]
          }, () => {
            window.location.href = '/index.html';
          });
        } else {
          tg.showAlert('Error: ' + (result.error || 'Failed to save'));
          tg.MainButton.hideProgress();
        }
      } catch (error) {
        console.error('Error:', error);
        tg.showAlert('Network error. Please try again.');
        tg.MainButton.hideProgress();
      }
    });
  </script>
</body>
</html>
