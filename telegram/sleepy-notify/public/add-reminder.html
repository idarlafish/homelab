<!-- public/add-reminder.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      background: var(--tg-theme-bg-color);
      color: var(--tg-theme-text-color);
      margin: 0;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }
    input[type="time"],
    input[type="date"],
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--tg-theme-hint-color);
      border-radius: 8px;
      font-size: 16px;
      background: var(--tg-theme-bg-color);
      color: var(--tg-theme-text-color);
      box-sizing: border-box;
    }
    textarea {
      min-height: 100px;
      resize: vertical;
      font-family: inherit;
    }
    .hint {
      font-size: 12px;
      color: var(--tg-theme-hint-color);
      margin-top: 4px;
    }
    .mode-indicator {
      padding: 8px 12px;
      background: var(--tg-theme-button-color);
      color: var(--tg-theme-button-text-color);
      border-radius: 6px;
      margin-bottom: 16px;
      text-align: center;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="mode-indicator" class="mode-indicator" style="display: none;"></div>

  <div class="form-group">
    <label for="date">📅 Date (optional)</label>
    <input type="date" id="date">
    <div class="hint">Leave empty for daily reminder</div>
  </div>
  
  <div class="form-group">
    <label for="time">⏰ Time</label>
    <input type="time" id="time" value="09:00" required>
  </div>
  
  <div class="form-group">
    <label for="message">💬 Message</label>
    <textarea id="message" placeholder="What should I remind you about?" required></textarea>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    
    // Parse URL params
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode') || 'create';
    const reminderId = urlParams.get('id');
    const existingTime = urlParams.get('time');
    const existingMessage = urlParams.get('message');
    const existingDate = urlParams.get('date');
    
    // Pre-fill form if editing
    if (mode === 'edit' && reminderId) {
      const indicator = document.getElementById('mode-indicator');
      indicator.textContent = '✏️ Editing Reminder';
      indicator.style.display = 'block';
      
      if (existingTime) document.getElementById('time').value = existingTime;
      if (existingMessage) document.getElementById('message').value = existingMessage;
      if (existingDate) document.getElementById('date').value = existingDate;
    }
    
    tg.ready();
    tg.expand();
    
    tg.MainButton.setText(mode === 'edit' ? 'Update Reminder' : 'Save Reminder');
    tg.MainButton.show();
    
    tg.MainButton.onClick(() => {
      const time = document.getElementById('time').value;
      const date = document.getElementById('date').value || undefined;
      const message = document.getElementById('message').value.trim();
      
      if (!time || !message) {
        tg.showAlert('Please fill all required fields');
        return;
      }
      
      const data = { 
        time, 
        date, 
        message,
        mode,
        id: reminderId // Include ID for updates
      };
      
      try {
        tg.sendData(JSON.stringify(data));
      } catch (error) {
        tg.showAlert('Error: ' + error.message);
      }
    });
  </script>
</body>
</html>
