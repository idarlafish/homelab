apiVersion: apps/v1
kind: Deployment
metadata:
  name: sleepy-notify-bot
  namespace: telegram
spec:
  replicas: 2  # Scale!
  selector:
    matchLabels:
      app: sleepy-notify-bot
  template:
    metadata:
      labels:
        app: sleepy-notify-bot
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
      - name: bot
        image: ghcr.io/idarlafish/sleepy-notify:arm64-fixed
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: REDIS_HOST
          value: "sleepy-notify-redis"
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: REDIS_PORT
          value: "6379"
        - name: BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: sleepy-bot-secrets
              key: bot-token
        - name: PUBLIC_DOMAIN
          valueFrom:
            secretKeyRef:
              name: sleepy-bot-secrets
              key: public-domain
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sleepy-notify-bot
  namespace: telegram
spec:
  selector:
    app: sleepy-notify-bot
  ports:
  - port: 3000
    targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sleepy-notify
  namespace: telegram
  annotations:
    kubernetes.io/ingress.class: nginx  # Install nginx-ingress
    cert-manager.io/cluster-issuer: letsencrypt-prod  # Optional HTTPS
spec:
  rules:
  - host: sleepy.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sleepy-notify-bot
            port:
              number: 3000
